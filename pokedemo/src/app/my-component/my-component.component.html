<label>
  <input [(ngModel)]="id">
  <input readonly [(ngModel)]="id">
</label>

<br>

Mon id est  : {{ id }}
<br>

Pokemon selection est : {{selectedPokeId}}

<label>
  <select [(ngModel)]="selectedPokeId" >
    <option *ngFor="let poke of pokes" [value]="poke.id">  {{poke.name}}  </option>
  </select>
</label>
<ul>
  <li *ngFor="let poke of pokes"> {{ poke.name }} </li>
</ul>
